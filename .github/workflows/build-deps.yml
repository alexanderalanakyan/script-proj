name: build deps
on: [push]
jobs:
  format:
    name: go
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          # Value already defaults to true, but `persist-credentials` is required to push new commits to the repository.
          persist-credentials: true
          submodules: true
      - name: Setup Go 1.25.x
        uses: actions/setup-go@v5
        with:
          # Semantic version range syntax or exact version of Go
          go-version: '1.25.x'
      - name: persist
        run: echo $(pwd)
      - name: Remove bin
        run: rm ./src/bin/gum
      - name: Build bin
        run: cd ./src/modules/gum && go build -o ../bin/gum
      - name: Copy LICENSE
        run: cp ./LICENSE ../bin/
      - name: Add+Commit+Push changes
        run: git add . && git commit -m "Building required bins" && git push


    