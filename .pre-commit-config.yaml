repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-shebang-scripts-are-executable
    -   id: check-executables-have-shebangs
    -   id: detect-private-key
    -   id: double-quote-string-fixer
- repo: local
  hooks:
    - id: pylint
      name: pylint
      entry: pylint
      language: system
      types: [python]
      require_serial: true
      args:
        [
          "-rn", # Only display messages
          "-sn", # Don't display the score
        ]
-   repo: https://github.com/PyCQA/bandit
    rev: 1.9.4 # Update me!
    hooks:
    - id: bandit
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.15.14
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
- repo: https://github.com/facebook/pyrefly-pre-commit
  rev: 1.0.0  # Note: this is the version of the pre-commit hook, NOT the pyrefly version used for type checking
  hooks:
    - id: pyrefly-check
      name: Pyrefly (type checking)
      pass_filenames: false  # Recommended to do full repo checks. However, you can change this to `true` to only check changed files
      language: system  # Use system-installed pyrefly
exclude: '^src/(modules|libs|bin)/.*'
