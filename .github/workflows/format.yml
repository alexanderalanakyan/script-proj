name: format
on: [push]
jobs:
  format:
    name: python
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true
          submodules: true
      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true 
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          # Value already defaults to true, but `persist-credentials` is required to push new commits to the repository.
          persist-credentials: true
      - name: Ruff Format
        run: uv run ruff format $(git ls-files '*.py')
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
              commit_message: Format Python
              file_pattern: -- '*.py' '!:src/libs' '!:src/modules' 
